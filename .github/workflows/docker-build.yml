name: Docker Build

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - "AGENTS.md"
      - ".github/workflows/**"
      - "screenshots/**"
      - ".beads/**"
      - "beads/**"
  workflow_dispatch:
    inputs:
      publish_latest:
        description: Publish this manually selected revision as latest
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          TAGS="ghcr.io/${{ github.repository }}:${SAFE_REF}"
          TAGS="$TAGS,ghcr.io/${{ github.repository }}:${SAFE_REF}-${SHORT_SHA}"
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ inputs.publish_latest }}" = "true" ]; then
            TAGS="$TAGS,ghcr.io/${{ github.repository }}:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
